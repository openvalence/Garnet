; Garnet: embedded Valence remote firmware. Pure ESP-IDF (no Arduino), LVGL 9.
;
; One env per board. The board's BSP file is chosen in src/CMakeLists.txt from
; GARNET_BOARD, and its sdkconfig overlay rides SDKCONFIG_DEFAULTS, both set
; through board_build.cmake_extra_args.
;
; Build:  pio run -e waveshare_s3_43
; Flash:  pio run -e waveshare_s3_43 -t upload --upload-port COMxx
;   Name the port every time: this bench also carries an OSSM stub (COM20) and
;   the P4 hub (COM15). Never flash either from here.

[platformio]
default_envs = waveshare_s3_43

[env]
; The same platform release Nucleus builds with (ESP-IDF 5.5.4).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv

; Waveshare ESP32-S3-Touch-LCD-4.3 (the 8 MB flash build, octal 8 MB PSRAM in
; package). The 16 MB variants need flash_size and partitions changed together.
[env:waveshare_s3_43]
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.cmake_extra_args = -DGARNET_BOARD=waveshare_s3_43 -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.waveshare_s3_43

; M5Stack CoreS3 SE (ESP32-S3, 16 MB flash, 8 MB quad PSRAM). No camera; the
; full CoreS3 is the same BSP plus parts Garnet does not use.
[env:m5_cores3se]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.cmake_extra_args = -DGARNET_BOARD=m5_cores3se -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.m5_cores3se
